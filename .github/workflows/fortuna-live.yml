name: Fortuna Live Data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fortuna/update_live.py
      - name: Commit fresh public data
        run: |
          git config user.name "fortuna-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fortuna/live.json
          git diff --cached --quiet || git commit -m "Refresh Fortuna live data"
          git push
